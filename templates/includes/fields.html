{% if form.non_field_errors %}<div class="form-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field{% if field.errors %} has-error{% endif %}{% if field.name == 'description' or field.name == 'image' %} field-wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-label="الزامی"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="help-text">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
